name: Release eslint-plugin-aaa-pattern

# Publishes to npm via Trusted Publishing (OIDC) — no npm token or OTP needed.
# Triggered by pushing a tag `eslint-plugin-aaa-pattern-v<version>`
# (scripts/release-eslint.sh does this).

on:
  push:
    tags:
      - 'eslint-plugin-aaa-pattern-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      # Trusted Publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./packages/eslint-plugin-aaa-pattern/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "eslint-plugin-aaa-pattern-v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi
      - run: npm publish --workspace=eslint-plugin-aaa-pattern
