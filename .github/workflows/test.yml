name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      eslint: ${{ steps.filter.outputs.eslint }}
      rubocop: ${{ steps.filter.outputs.rubocop }}
      phpcs: ${{ steps.filter.outputs.phpcs }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            eslint:
              - 'packages/eslint-plugin-aaa-pattern/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/test.yml'
            rubocop:
              - 'packages/rubocop-aaa/**'
              - '.github/workflows/test.yml'
            phpcs:
              - 'packages/phpcs-aaa/**'
              - '.github/workflows/test.yml'

  eslint:
    needs: changes
    if: needs.changes.outputs.eslint == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
        eslint: ['9', '10']
    name: eslint (node ${{ matrix.node }}, eslint ${{ matrix.eslint }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm install -w eslint-plugin-aaa-pattern --save-dev eslint@${{ matrix.eslint }}
      - name: Show resolved eslint version
        working-directory: packages/eslint-plugin-aaa-pattern
        run: node -p "require('eslint/package.json').version"
      - run: npm test -w eslint-plugin-aaa-pattern

  rubocop:
    needs: changes
    if: needs.changes.outputs.rubocop == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.3', '3.4']
    name: rubocop (ruby ${{ matrix.ruby }})
    defaults:
      run:
        working-directory: packages/rubocop-aaa
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: packages/rubocop-aaa
          bundler-cache: true
      - run: bundle exec rubocop --version
      - run: bundle exec rspec

  phpcs:
    needs: changes
    if: needs.changes.outputs.phpcs == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.4']
        phpcs: ['^3.7', '^4.0']
    name: phpcs (php ${{ matrix.php }}, phpcs ${{ matrix.phpcs }})
    defaults:
      run:
        working-directory: packages/phpcs-aaa
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer update --no-interaction --no-progress --with "squizlabs/php_codesniffer:${{ matrix.phpcs }}"
      - run: vendor/bin/phpcs --version
      - run: vendor/bin/phpunit
