version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: bundler
    directory: /packages/rubocop-aaa
    schedule:
      interval: monthly

  - package-ecosystem: composer
    directory: /packages/phpcs-aaa
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
